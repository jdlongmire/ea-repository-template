# The view register: every generated view, its viewpoint, and its scope.
#
# A view is a registered projection of catalog.toml, not an
# illustration. Each entry names its viewpoint and concern, its level
# and focus area, and the elements it shows. render_views.py draws
# exactly the registered elements and, between them, the catalogued
# relations. Two completeness flags state the contract:
#
#   membership_complete: the element list is the whole of the
#     viewpoint's scope, not a selection from it.
#   relation_complete: every catalogued relation between the shown
#     elements is drawn. A view that draws only some relations lists
#     them explicitly in a "relations" field ("SOURCE verb TARGET")
#     and sets this flag to false.
#
# Generated outputs land in 05-evidence/views/ and are never edited by
# hand; the verifier fails on stale or unregistered outputs.


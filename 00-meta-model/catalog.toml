# The model of record: architecture elements and their relations.
#
# Every element is a typed artifact somewhere in this repository; the
# verifier binds the two together (same id, type, name, and level), so
# the catalog and the artifacts are two projections of one record, not
# two records that can drift apart. Relations use the vocabulary fixed
# in schemas.json ("relation_types"). Views registered in views.toml
# are generated from this catalog by render_views.py and are never
# drawn by hand.

